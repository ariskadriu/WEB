<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Product Orders</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Login</h1>
      <section class="card">
        <form id="login-form" style="display:flex;gap:8px;align-items:center">
          <input type="text" id="login-username" placeholder="Username" required />
          <input type="password" id="login-password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
        <div id="login-error" style="color:#c00;margin-top:8px"></div>
        <div style="margin-top:16px;color:#666">
          Employees must be created by an admin.
          <button type="button" id="btn-open-admin-modal" style="background:var(--accent);color:#fff;padding:6px 12px;border:0;border-radius:6px;cursor:pointer;font-weight:600;font-size:0.9rem;margin-left:8px">Go to Admin Panel</button>
        </div>
      </section>
      <!-- Admin Login Modal -->
      <div id="admin-modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Admin Access</h2>
            <button type="button" class="modal-close" id="modal-close">&times;</button>
          </div>
          <div class="modal-body">
            <p style="margin:0 0 16px;color:var(--text-secondary)">Enter admin password to access the admin panel.</p>
            <input type="password" id="admin-modal-pass" placeholder="Admin password" />
            <div id="admin-modal-error" class="error"></div>
            <button type="button" id="admin-modal-submit">Access Admin Panel</button>
          </div>
        </div>
      </div>
    </div>
    <script src="login.js"></script>
    <script>
      // Admin modal functionality
      const adminModal = document.getElementById('admin-modal');
      const btnOpenAdminModal = document.getElementById('btn-open-admin-modal');
      const modalClose = document.getElementById('modal-close');
      const adminModalPass = document.getElementById('admin-modal-pass');
      const adminModalError = document.getElementById('admin-modal-error');
      const adminModalSubmit = document.getElementById('admin-modal-submit');

      if (btnOpenAdminModal) {
        btnOpenAdminModal.addEventListener('click', () => {
          adminModal.classList.add('show');
          if (adminModalPass) adminModalPass.focus();
          if (adminModalError) adminModalError.textContent = '';
        });
      }

      if (modalClose) {
        modalClose.addEventListener('click', () => {
          adminModal.classList.remove('show');
          if (adminModalPass) adminModalPass.value = '';
          if (adminModalError) adminModalError.textContent = '';
        });
      }

      if (adminModal) {
        adminModal.addEventListener('click', (e) => {
          if (e.target === adminModal) {
            adminModal.classList.remove('show');
            if (adminModalPass) adminModalPass.value = '';
            if (adminModalError) adminModalError.textContent = '';
          }
        });
      }

      if (adminModalSubmit) {
        adminModalSubmit.addEventListener('click', async () => {
          const pass = adminModalPass ? adminModalPass.value.trim() : '';
          if (!pass) {
            if (adminModalError) adminModalError.textContent = 'Please enter a password';
            return;
          }
          try {
            const res = await fetch('/api/admin/login', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({password: pass})});
            if (!res.ok) {
              const err = await res.json().catch(()=>({}));
              throw new Error(err.error || res.statusText || 'Login failed');
            }
            const data = await res.json();
            if (data && data.ok) {
              localStorage.setItem('adminPass', pass);
              adminModal.classList.remove('show');
              window.location.href = '/admin.html';
            } else {
              throw new Error('Invalid response');
            }
          } catch (err) {
            if (adminModalError) adminModalError.textContent = String(err.message || err);
            if (adminModalPass) { adminModalPass.value = ''; adminModalPass.focus(); }
          }
        });
      }

      if (adminModalPass) {
        adminModalPass.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            if (adminModalSubmit) adminModalSubmit.click();
          }
        });
      }
    </script>
  </body>
</html>
